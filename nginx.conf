server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # O TLS termina no proxy do EasyPanel, então o nginx só enxerga http.
    # Sem isto, um redirect vira "http://..." e o navegador dá um salto extra
    # (e o aviso de conteúdo misto). Com Location relativo, o esquema é mantido.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/html text/css application/javascript image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Imagens em qualquer profundidade (/img/ e /cards/img/): cache longo e
    # 404 de verdade. Sem esta regra, o fallback do location / devolveria o
    # HTML com status 200 no lugar do JPEG — e a validação por status passaria.
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|avif)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # A landing vive em /cards_seguranca_familiar/ e tem index próprio.
    location /cards_seguranca_familiar/ {
        try_files $uri $uri/ /cards_seguranca_familiar/index.html;
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    location = /luz {
        return 301 /a-palavra-de-cada-dia/;
    }

    location = /luz/ {
        return 301 /a-palavra-de-cada-dia/;
    }

    location = /a-palavra-de-cada-dia {
        return 301 /a-palavra-de-cada-dia/;
    }

    location /a-palavra-de-cada-dia/ {
        try_files $uri $uri/ /a-palavra-de-cada-dia/index.html;
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    location = /luz-para-cada-dia {
        return 301 /luz-para-cada-dia/;
    }

    location /luz-para-cada-dia/ {
        try_files $uri $uri/ /luz-para-cada-dia/index.html;
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
